name: 桌面安装包

on:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_call:
    inputs:
      artifact_retention_days:
        description: Actions 中间产物保留天数
        required: false
        default: 7
        type: number

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: macos-arm64
            artifact: TermVista-macOS-Apple-Silicon
            os: macos-15
            target: aarch64-apple-darwin
            bundles: dmg
            bundle_path: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          - id: macos-x64
            artifact: TermVista-macOS-Intel
            os: macos-15-intel
            target: x86_64-apple-darwin
            bundles: dmg
            bundle_path: src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
          - id: windows-x64
            artifact: TermVista-Windows-x64
            os: windows-2025
            target: x86_64-pc-windows-msvc
            bundles: nsis
            bundle_path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
          - id: linux-x64
            artifact: TermVista-Linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
            bundle_path: |
              src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
              src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
    steps:
      - name: 检出源码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 设置 Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: 设置 pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.32.1
          cache: true

      - name: 验证 pnpm 版本并安装依赖
        shell: bash
        run: |
          test "$(pnpm --version)" = "10.32.1"
          pnpm install --frozen-lockfile

      - name: 安装 Rust stable 与目标平台
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component clippy --component rustfmt
          rustup default stable
          rustup target add "${{ matrix.target }}"

      - name: 安装 Linux Tauri 构建依赖
        if: startsWith(matrix.id, 'linux-')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            librsvg2-dev \
            patchelf \
            wget

      - name: 构建 macOS DMG（ad-hoc 签名）
        if: startsWith(matrix.id, 'macos-')
        env:
          APPLE_SIGNING_IDENTITY: '-'
        shell: bash
        run: pnpm tauri build --bundles "${{ matrix.bundles }}" --target "${{ matrix.target }}"

      - name: 构建 Windows 安装包
        if: startsWith(matrix.id, 'windows-')
        shell: bash
        run: pnpm tauri build --bundles "${{ matrix.bundles }}" --target "${{ matrix.target }}"

      - name: 构建 Linux 安装包
        if: startsWith(matrix.id, 'linux-')
        shell: bash
        run: pnpm tauri build --bundles "${{ matrix.bundles }}" --target "${{ matrix.target }}"

      - name: 上传安装包
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.bundle_path }}
          if-no-files-found: error
          retention-days: ${{ inputs.artifact_retention_days || 7 }}
