name: 版本 Draft Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  verify-version:
    name: 校验发布版本
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: 检出源码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 设置 Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: 校验标签与三个工程版本一致
        run: node scripts/ci/verify-release.mjs "$GITHUB_REF_NAME"

  build:
    name: 构建跨平台安装包
    needs: verify-version
    permissions:
      contents: read
    uses: ./.github/workflows/desktop-build.yml
    with:
      artifact_retention_days: 2

  draft-release:
    name: 创建或更新 Draft Release
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: 下载 Windows 与 macOS 安装包
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: TermVista-macOS-*
          path: release-assets
          merge-multiple: true

      - name: 下载 Windows 安装包
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: TermVista-Windows-*
          path: release-assets
          merge-multiple: true

      - name: 创建或更新草稿版本
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          mapfile -d '' assets < <(find release-assets -type f -print0 | sort -z)
          if (( ${#assets[@]} == 0 )); then
            echo "没有找到可上传的安装包文件。" >&2
            exit 1
          fi

          if draft_state="$(gh release view "$tag" --json isDraft --jq '.isDraft' 2>/dev/null)"; then
            if [[ "$draft_state" != "true" ]]; then
              echo "标签 $tag 已对应正式 Release；为保护已发布资产，停止覆盖。" >&2
              exit 1
            fi
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            gh release create "$tag" "${assets[@]}" \
              --draft \
              --verify-tag \
              --generate-notes \
              --title "TermVista $tag"
          fi
