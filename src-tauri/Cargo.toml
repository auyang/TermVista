[package]
name = "ai-ssh-studio"
version = "0.1.0"
description = "TermVista（端境）：跨平台 SSH/SFTP 智能远程工作台"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ai_ssh_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
aes-gcm = { version = "0.11.1", features = ["zeroize"] }
argon2 = "0.6.0"
getrandom = "0.4.3"
async-trait = "0.1"
russh = "0.64.1"
futures-util = "0.3"
keyring = "4.2.0"
regex = "1"
glob = "0.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "rustls"] }
idna = "1.1.0"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
uuid = { version = "1", features = ["v4"] }
zeroize = "1"
russh-sftp = "3.0.1"
rusqlite = { version = "0.31.0", features = ["bundled"] }
base64 = "0.22"
minisign-verify = "0.3"
tauri-plugin-updater = "2.14.0"
tauri-plugin-process = "^2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSPasteboard", "NSPasteboardItem"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSArray", "NSString", "NSURL"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
